name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: gdformat -l 120 --check addons/lrd_run_log tests
      - run: gdlint addons/lrd_run_log tests

  gdunit4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Import
        run: |
          godot --headless --editor --quit || true
          godot --headless --import
      - name: Run tests
        run: godot --headless -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode -c
